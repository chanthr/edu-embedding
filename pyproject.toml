[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "edu-embedding"
version = "0.1.0"
description = "Embedding model and hybrid retrieval that match student interests to university programs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
eval = [
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyarrow>=14",
    "huggingface_hub>=0.23",
    "safetensors>=0.4",
]
dev = ["pytest>=8"]

[project.scripts]
edu-embedding = "edu_embedding.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/edu_embedding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
